<!DOCTYPE html>
<html lang="vi">
<head>
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Ngoại Ngữ Đa Năng</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <script>
        /**
         * 1. HỆ THỐNG QUẢN LÝ NGÔN NGỮ
         */
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'en';
        
        // Khai báo gameData ở mức toàn cục để mọi hàm đều truy cập được
        let gameData = [];

        const script = document.createElement('script');
        script.src = lang === 'ja' ? 'data_ja.js' : (lang === 'ko' ? 'data_ko.js' : 'data.js');
        script.onload = () => { 
            // Khởi tạo dữ liệu ngay khi file js load xong
            if (typeof myFullThemes !== 'undefined') {
                gameData = myFullThemes.map((theme, index) => ({ 
                    id: index + 1, 
                    name: theme.name, 
                    questions: theme.words 
                }));
                if(document.readyState === 'complete') {
                    renderMap();
                    updateProgressBar();
                }
            }
        };
        document.head.appendChild(script);

        const langConfig = {
            'en': { code: 'en-US', label: 'English', flag: '🇺🇸' },
            'ja': { code: 'ja-JP', label: 'Japanese', flag: '🇯🇵' },
            'ko': { code: 'ko-KR', label: 'Korean', flag: '🇰🇷' }
        };
        const currentLang = langConfig[lang] || langConfig['en'];
    </script>

    <style>
        /* --- 2. CSS GIAO DIỆN (ĐÃ TỐI ƯU) --- */
        :root { --primary: #FFD700; --success: #4CAF50; --locked: #bdc3c7; --bg: #f0f9ff; --text: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; touch-action: manipulation; }
        #game-container { width: 95%; max-width: 500px; background: white; padding: 15px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); box-sizing: border-box; position: relative; }
        .hidden { display: none !important; }

        .lang-selector { display: flex; justify-content: flex-end; gap: 15px; margin-bottom: 5px; }
        .lang-item { cursor: pointer; font-size: 1.5rem; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s; }
        .lang-item span { font-size: 0.6rem; font-weight: bold; margin-top: -5px; }

        .progress-wrapper { width: 100%; background: #eee; border-radius: 20px; height: 15px; margin-bottom: 5px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4CAF50, #8BC34A); transition: width 0.5s; }

		/* --- TỐI ƯU BẢN ĐỒ CHO MỌI MÀN HÌNH --- */
		.map { 
			display: grid; 
			/* Màn hình đứng (mặc định): chia 3 cột để ô đủ to */
			grid-template-columns: repeat(3, 1fr); 
			gap: 8px; 
			padding: 10px 0; 
			width: 100%; 
			box-sizing: border-box; 
		}

		/* Khi màn hình nằm ngang hoặc máy tính: chia 4 cột */
		@media (min-width: 450px) { 
			.map { grid-template-columns: repeat(4, 1fr); gap: 12px; } 
		}
		
		.level-node { 
			width: 100%; 
			aspect-ratio: 1/1; 
			display: flex; 
			flex-direction: column; 
			/* Căn giữa theo cả hai chiều */
			justify-content: center; 
			align-items: center;
			border-radius: 15px; 
			cursor: pointer; 
			background: #fff; 
			box-shadow: 0 4px 10px rgba(0,0,0,0.05);
			box-sizing: border-box;
			padding: 6px; 
			overflow: hidden;
			text-align: center; /* Đảm bảo chữ luôn ở giữa */
		}
        .level-node.active { background: var(--primary); transform: scale(1.05); }
        .level-node.completed { background: #e8f5e9; color: var(--success); border: 2px solid var(--success); gap: 2px; }
        .level-node.locked { background: #f5f5f5; color: #999; opacity: 0.6; cursor: not-allowed; }
        
        /* Chữ số và Icon ✅ */
		/* Căn giữa biểu tượng khóa hoặc số ải */
		.level-node div:first-child {
			width: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.level-node.completed div:first-child { font-size: 1rem; }
		/* Tên ải: Cực kỳ quan trọng để không bị tràn chữ Nhật/Hàn */
		/* Tên ải cho ô CHƯA vượt qua (Locked) và ô HIỆN TẠI (Active) */
		.level-node div:last-child { 
			font-size: 0.65rem; /* Tăng cỡ chữ to hơn một chút */
			line-height: 1.2;
			width: 100%;
			margin-top: 2px;
			display: block; /* Trả về block để text-align: center có tác dụng */
		}
		/* Giữ nguyên quy tắc thu nhỏ riêng cho ô ĐÃ vượt qua (Completed) để nhường chỗ cho nút Play */
		.level-node.completed div:last-child { 
			font-size: 0.5rem; 
			line-height: 1;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
		}

		/* Nút Play 🎮 - Tối ưu cho màn hình đứng */
		.game-icon-btn { 
			margin-top: 3px; 
			padding: 2px 4px; 
			background: #FF5722; 
			color: white; 
			border-radius: 6px; 
			font-size: 9px; /* Chữ nhỏ để không chiếm chỗ */
			border: none;
			white-space: nowrap;
		}
		
		/* Ẩn bớt chữ "Play" nếu màn hình quá hẹp, chỉ hiện icon 🎮 */
		@media (max-width: 360px) {
			.game-icon-btn { font-size: 0; padding: 4px; }
			.game-icon-btn::before { content: "🎮"; font-size: 12px; }
		}

        .vocab-img-container { width: 100%; max-width: 250px; aspect-ratio: 1/1; border-radius: 25px; border: 6px solid #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.1); margin: 15px auto; position: relative; overflow: hidden; }
        .vocab-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button.option { padding: 12px 5px; font-size: 1rem; font-weight: bold; border-radius: 15px; border: 2px solid #eee; background: #fff; cursor: pointer; box-shadow: 0 3px 0 #eee; }
        button.option.correct-choice { background: var(--success) !important; color: white !important; border: none; box-shadow: 0 3px 0 #2e7d32; }
        .next-btn { padding: 15px 20px; font-size: 1.1rem; background: #FF9800; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #e68a00; }

		@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-15px); } 75% { transform: translateX(15px); } }
		.shaking { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div id="congrats-modal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000;">
    <div class="congrats-card" style="background: white; padding: 30px; border-radius: 30px; text-align: center;">
        <h1>👑 VỊ VUA NGÔN NGỮ! 👑</h1>
        <img src="https://img.freepik.com/free-vector/golden-cup-victory-flat-style_78370-166.jpg" alt="Cúp Vàng" style="width:120px;">
        <br><button onclick="backToMap()" class="next-btn" style="margin-top:20px;">Quay lại bản đồ</button>
    </div>
</div>

<div id="game-container">
    <div class="lang-selector">
        <div class="lang-item" onclick="switchLanguage('en')">🇺🇸<span>English</span></div>
        <div class="lang-item" onclick="switchLanguage('ja')">🇯🇵<span>Japanese</span></div>
        <div class="lang-item" onclick="switchLanguage('ko')">🇰🇷<span>Korean</span></div>
    </div>

    <div class="progress-wrapper"><div class="progress-bar" id="progress-bar"></div></div>
    <div id="progress-text" style="font-weight:bold; font-size: 0.8rem; text-align: center; margin-bottom: 10px;">Tiến trình: 0%</div>
	
    <div id="screen-map">
		<h2 id="admin-touch-zone" style="margin-top:0;">🚩 Bản Đồ Phiêu Lưu</h2>
        <button onclick="confirmReset()" style="margin-bottom: 15px; padding: 8px 15px; border-radius: 12px; cursor: pointer; background: #ff5252; color: white; border: none; font-size: 0.8rem; font-weight: bold;">🔄 Chơi lại từ đầu</button>
        <div class="map" id="map-levels"></div>
    </div>

    <div id="screen-quiz" class="hidden">
        <div style="display:flex; justify-content: space-between; align-items:center;">
            <button onclick="backToMap()" style="cursor:pointer; background:#f0f0f0; border:none; width: 40px; height: 40px; border-radius: 50%; font-size:18px;">🏠</button>
            <h3 id="level-title" style="margin:0; font-size: 0.9rem;">Ải: ...</h3>
            <div id="quest-count" style="font-weight:bold; color:#3498db; font-size: 0.8rem;">1/10</div>
        </div>
        <div class="vocab-img-container" onclick="playSound(currentLevel.questions[currentQuestIndex].w)">
            <img id="display-image" src="" alt="Learning">
            <div style="position: absolute; bottom: 10px; right: 10px; background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">🔊</div>
        </div>
        <div class="options" id="options-container"></div>
		<div style="display: flex; gap: 10px; margin-top: 20px;">
			<button id="prev-step-btn" class="next-btn hidden" style="width: 40%; background: #95a5a6; box-shadow: 0 4px 0 #7f8c8d;" onclick="goPrevQuestion()">⬅️ TRƯỚC</button>
			<button id="next-step-btn" class="next-btn hidden" style="flex-grow: 1;" onclick="goNextQuestion()">TIẾP THEO ➡️</button>
		</div>
    </div>
	
	<div id="screen-game" class="hidden" style="position: relative; height: 75vh; overflow: hidden; background: #e0f7fa; border-radius: 20px; border: 2px solid #b2ebf2;">
		<div style="display:flex; justify-content: space-between; padding: 10px; position: absolute; width: 100%; box-sizing: border-box; z-index: 10;">
			<button onclick="backToMap()" style="cursor:pointer; background:white; border:none; width: 35px; height: 35px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">🏠</button>
			<div id="game-score" style="font-weight:bold; font-size: 1rem; color: #00796b; background: white; padding: 5px 12px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">⭐ 0 | ❤️ 10</div>
		</div>
		<div id="catcher" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; z-index: 5;">
			<img id="catcher-img" src="" style="width: 100%; height: 100%; object-fit: cover; border: 4px solid white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
		</div>
	</div>
</div>

<script>
    /* --- 3. LOGIC CHÍNH --- */
    const storageKey = `progress_${lang}`; 
	let userProgress = parseInt(localStorage.getItem(storageKey)) || 1; 
	let currentLevel = null; let currentQuestIndex = 0; let solvedQuestions = [];
    let gameActive = false; let gameInterval; let score = 0; let mistakes = 0; 
    let fallSpeed = 3.5; let spawnRate = 1800;

    function switchLanguage(newLang) {
        if (newLang === lang) return;
        if (confirm("Bé muốn chuyển ngôn ngữ không?")) window.location.href = `?lang=${newLang}`;
    }

    function confirmReset() {
        if (confirm("Bé muốn chơi lại từ đầu không?")) { localStorage.removeItem(storageKey); location.reload(); }
    }

    function updateProgressBar() {
    // Nếu userProgress > số lượng ải (tức là đã xong ải 30) thì set 100% luôn
    let pct = userProgress > gameData.length ? 100 : Math.round(((userProgress - 1) / gameData.length) * 100);
    document.getElementById('progress-bar').style.width = pct + "%";
    document.getElementById('progress-text').innerText = `${currentLang.label}: ${pct}%`;
	}

	function playSound(text) {
		window.speechSynthesis.cancel();
		const speech = new SpeechSynthesisUtterance(text);
		speech.lang = currentLang.code;
		speech.rate = (lang === 'en') ? 0.9 : 0.8; 
		const voices = window.speechSynthesis.getVoices();
		let sv = voices.find(v => v.lang === currentLang.code && (v.name.includes('Google') || v.name.includes('Natural')));
		if (sv) speech.voice = sv;
		window.speechSynthesis.speak(speech);
	}

	function renderMap() {
		const mapDiv = document.getElementById('map-levels');
		if(!mapDiv || !gameData.length) return;
		mapDiv.innerHTML = '';
		gameData.forEach(level => {
			const node = document.createElement('div');
			node.className = 'level-node';
			if (level.id <= userProgress) {
				if (level.id < userProgress) {
					node.classList.add('completed');
					node.innerHTML = `
						<div>✅</div>
						<div>${level.name}</div>
						<button class="game-icon-btn" onclick="event.stopPropagation(); unlockAudio(); startFallingGame(gameData[${level.id-1}])">🎮 Play</button>
					`;
				} else {
					node.classList.add('active');
					node.innerHTML = `<div>${level.id}</div><div>${level.name}</div>`;
				}
				node.onclick = () => startLevel(level);
			} else {
				node.classList.add('locked');
				node.innerHTML = `<div>🔒</div><div>${level.name}</div>`;
			}
			mapDiv.appendChild(node);
		});
	}

	function startLevel(level) {
		currentLevel = level; currentQuestIndex = 0; solvedQuestions = [];
		document.getElementById('screen-map').classList.add('hidden');
		document.getElementById('screen-quiz').classList.remove('hidden');
		document.getElementById('level-title').innerText = `${currentLang.flag} ${level.name}`;
		showQuestion();
	}
	
	function showQuestion() {
		const quest = currentLevel.questions[currentQuestIndex];
		document.getElementById('quest-count').innerText = `${currentQuestIndex + 1}/${currentLevel.questions.length}`;
		document.getElementById('display-image').src = quest.img;
		document.getElementById('next-step-btn').classList.toggle('hidden', !solvedQuestions.includes(currentQuestIndex));
		document.getElementById('prev-step-btn').classList.toggle('hidden', currentQuestIndex === 0);

		const optDiv = document.getElementById('options-container');
		optDiv.innerHTML = '';
		quest.opts.forEach(opt => {
			const btn = document.createElement('button');
			btn.className = 'option'; btn.innerText = opt;
			if (solvedQuestions.includes(currentQuestIndex) && opt === quest.w) btn.classList.add('correct-choice');
			btn.onclick = () => {
                if (opt === quest.w) {
                    if (!solvedQuestions.includes(currentQuestIndex)) solvedQuestions.push(currentQuestIndex);
                    confetti({ particleCount: 50, origin: { y: 0.7 } }); playSound(opt);
                    showQuestion();
                } else {
                    playSound('Try again');
                    btn.style.backgroundColor = '#ffcdd2';
                }
            };
			optDiv.appendChild(btn);
		});
	}
	
	function goNextQuestion() {
		if (currentQuestIndex < currentLevel.questions.length - 1) { currentQuestIndex++; showQuestion(); }
		else {
			if (currentLevel.id === userProgress) {
				userProgress++; localStorage.setItem(storageKey, userProgress); 
				updateProgressBar();
				if (userProgress > gameData.length) document.getElementById('congrats-modal').classList.remove('hidden');
				else backToMap();
			} else backToMap();
		}
	}

    function goPrevQuestion() { if (currentQuestIndex > 0) { currentQuestIndex--; showQuestion(); } }

	function backToMap() {
		gameActive = false; clearTimeout(gameInterval); window.speechSynthesis.cancel();
		const gameArea = document.getElementById('screen-game');
		gameArea.querySelectorAll('.falling-word').forEach(d => d.remove());
		document.getElementById('screen-map').classList.remove('hidden');
		document.getElementById('screen-quiz').classList.add('hidden');
		document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('congrats-modal').classList.add('hidden');
		renderMap(); updateProgressBar();
	}

	/* --- 4. GAME HỨNG TỪ --- */
	function startFallingGame(level) {
		document.getElementById('screen-map').classList.add('hidden');
		document.getElementById('screen-game').classList.remove('hidden');
		gameActive = true; score = 0; mistakes = 0; fallSpeed = 3.5; spawnRate = 1800;
		updateGameScoreUI();
		
		const gameArea = document.getElementById('screen-game');
		const catcher = document.getElementById('catcher');
		const cImg = document.getElementById('catcher-img');
		
		let target = level.questions[Math.floor(Math.random() * level.questions.length)];
		cImg.src = target.img;

        // Xử lý di chuyển
        const moveHandler = (e) => {
            if(!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = gameArea.getBoundingClientRect();
            let x = clientX - rect.left - 35;
            catcher.style.left = Math.max(0, Math.min(x, rect.width - 70)) + 'px';
            catcher.style.transform = 'none';
        };
		gameArea.onmousemove = moveHandler;
        gameArea.ontouchmove = (e) => { moveHandler(e); e.preventDefault(); };

		function spawn() {
			if (!gameActive) return;
			const word = document.createElement('div');
            word.className = 'falling-word';
			const isT = Math.random() > 0.6;
			const q = isT ? target : level.questions[Math.floor(Math.random() * level.questions.length)];
			word.innerText = q.w;
			word.style.cssText = `position: absolute; top: -40px; left: ${Math.random() * 70 + 10}%; font-weight: bold; font-size: 1.1rem; background: white; padding: 6px 12px; border-radius: 10px; transition: top ${fallSpeed}s linear; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1;`;
			gameArea.appendChild(word);
			
            setTimeout(() => { if(word) word.style.top = '110%'; }, 50);

			const check = setInterval(() => {
				if (!gameActive) { clearInterval(check); return; }
				let r1 = catcher.getBoundingClientRect(); let r2 = word.getBoundingClientRect();
				if (!(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom)) {
					if (word.innerText === target.w) {
						score += 10; confetti({ particleCount: 15, origin: { y: 0.8 } }); playSound(target.w);
						target = level.questions[Math.floor(Math.random() * level.questions.length)];
						cImg.src = target.img;
						if (score % 50 === 0 && fallSpeed > 1.5) { fallSpeed -= 0.3; spawnRate = Math.max(800, spawnRate - 150); }
					} else {
						mistakes++; 
						// Tự động chọn câu "Thử lại" theo ngôn ngữ đang học
						let retryText = 'Try again'; // Mặc định tiếng Anh
						if (lang === 'ja') retryText = '残念、もう一度'; // Tiếng Nhật: Zannen, mou ichido (Tiếc quá, lại lần nữa nhé)
						else if (lang === 'ko') retryText = '다시 시도하세요'; // Tiếng Hàn: Dasi sido-haseyo (Hãy thử lại lần nữa)

						playSound(retryText);
						catcher.classList.add('shaking'); setTimeout(() => catcher.classList.remove('shaking'), 400);
						if (mistakes >= 10) { gameActive = false; alert("Kết thúc! Điểm: " + score); backToMap(); }
					}
					updateGameScoreUI(); word.remove(); clearInterval(check);
				}
			}, 50);
			setTimeout(() => { if(word.parentNode) word.remove(); clearInterval(check); }, fallSpeed * 1050);
			gameInterval = setTimeout(spawn, spawnRate);
		}
		spawn();
	}
	function updateGameScoreUI() { document.getElementById('game-score').innerHTML = `⭐ ${score} | ❤️ ${10 - mistakes}`; }
	/**
	 * Hàm đánh thức hệ thống âm thanh trên điện thoại
	 */
	function unlockAudio() {
		const msg = new SpeechSynthesisUtterance(''); // Tạo một câu nói rỗng
		window.speechSynthesis.speak(msg); // Phát lệnh rỗng để "mở khóa" quyền âm thanh
	}
    // Đảm bảo dữ liệu được vẽ khi trang load xong hoàn toàn
    window.onload = () => { if(gameData.length) { renderMap(); updateProgressBar(); } };
	
	/* --- 6. TÍNH NĂNG ADMIN (PHÍM TẮT & MOBILE TAP) --- */
	let keysPressed = {}; // Lưu trạng thái phím đang nhấn
	let tapCount = 0;
	let tapTimer;
	let previousProgress = null; // Khởi tạo là null để biết chưa có lệnh mở khóa nào được thực hiện

	// Phím tắt trên Máy tính: A+K để mở khóa, L+K để quay lại ải 1
	/* --- 6. TÍNH NĂNG ADMIN CẢI TIẾN --- */
	window.addEventListener('keydown', (e) => {
		const key = e.key.toLowerCase();
		keysPressed[key] = true;
		
		// 1. Nhấn A + K: MỞ KHÓA TẤT CẢ (Lưu lại trạng thái cũ)
		if (keysPressed['a'] && keysPressed['k']) { 
			// Chỉ lưu nếu hiện tại chưa phải là trạng thái "đã mở khóa hết"
			if (userProgress <= gameData.length) {
				previousProgress = userProgress; 
			}
			
			userProgress = gameData.length + 1; 
			localStorage.setItem(storageKey, userProgress);
			keysPressed = {}; 
			renderMap(); 
			updateProgressBar(); 
			alert("🔓 Admin: Đã mở khóa tất cả! (Nhấn L+K để hoàn tác)");
		}
		
		// 2. Nhấn L + K: HOÀN TÁC hoặc LÙI ẢI
		if (keysPressed['l'] && keysPressed['k']) { 
			// TRƯỜNG HỢP 1: Nếu có tiến trình cũ để hoàn tác (sau khi bấm A+K)
			if (previousProgress !== null) {
				userProgress = previousProgress; 
				previousProgress = null; // Reset về null sau khi đã hoàn tác xong
				localStorage.setItem(storageKey, userProgress);
				keysPressed = {}; 
				renderMap(); 
				updateProgressBar(); 
				alert("⏪ Admin: Đã khôi phục lại tiến trình thực tế (Ải " + userProgress + ")");
			} 
			// TRƯỜNG HỢP 2: Nếu không có gì để hoàn tác, thì lùi 1 ải như bình thường
			else if (userProgress > 1) {
				userProgress--;
				localStorage.setItem(storageKey, userProgress);
				keysPressed = {};
				renderMap();
				updateProgressBar();
			}
		}
	});

	window.addEventListener('keyup', (e) => {
		delete keysPressed[e.key.toLowerCase()];
	});

	// Chạm 5 lần trên Điện thoại vào chữ "Bản Đồ Phiêu Lưu"
	const adminZone = document.getElementById('admin-touch-zone');
	if (adminZone) {
		adminZone.addEventListener('click', function () {
			tapCount++;
			clearTimeout(tapTimer);
			tapTimer = setTimeout(() => { tapCount = 0; }, 2000); // Reset nếu không bấm nhanh
			
			if (tapCount === 5) { 
				previousProgress = userProgress; // Thêm dòng này vào hàm tap 5 lần
				userProgress = 31; 
				localStorage.setItem(storageKey, userProgress);
				renderMap(); 
				updateProgressBar(); 
				alert("🔑 Admin Mobile: Đã mở khóa tất cả!");
				tapCount = 0;
			}
		});
	}
</script>
</body>
</html>
